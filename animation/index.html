<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIXORA - Animation</title>
<style>
body{background:#070707;color:#fff;text-align:center;font-family:sans-serif;padding:20px;margin:0}
h1{color:#FF6600}
.box{max-width:700px;margin:auto;background:#141414;padding:25px;border:1px solid #222;border-radius:16px}
button{background:#FF6600;color:#000;border:none;padding:12px 25px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:16px;margin:10px}
button:hover{background:#ff8800}
#stage{width:100%;height:300px;background:#000;border:2px solid #222;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:20px 0}
input{width:90%;padding:12px;border-radius:8px;border:1px solid #333;background:#000;color:#fff;margin:10px 0}
.back{display:inline-block;margin-top:15px;color:#FF6600;text-decoration:none;border:1px solid #333;padding:8px 15px;border-radius:20px}
.live{color:#00ff88;background:#003322;padding:3px 10px;border-radius:20px;font-size:11px}
</style>
</head>
<body>
<h1>NIXORA ANIMATION <span class="live">● LIVE</span></h1>
<p style="color:#888">Module 4 - Bring Characters to Life - God Mode</p>

<div class="box">
<input id="text" placeholder="Describe animation: e.g. Naruto running, Afrobeats dance...">
<div id="stage">⚡ STAGE READY - Waiting...</div>
<button onclick="playAnim()">▶️ PLAY ANIMATION</button>
<button onclick="document.getElementById('stage').innerHTML='🔄 Reset'">🔄 RESET</button>
<p style="font-size:12px;color:#666;margin-top:15px">Engine: Local + Free API - No server needed - Works offline</p>
</div>

<a class="back" href="../">← Back to Dashboard</a>

<script src="../config/engines.js"></script>
<script>
function playAnim(){
  let t = document.getElementById('text').value || "Nixora Character";
  document.getElementById('stage').innerHTML = "🎬 ANIMATION PLAYING: " + t + " - NIXORA GOD MODE 🔥";
  
  // Fake animation effect
  let stage = document.getElementById('stage');
  stage.style.borderColor = "#FF6600";
  setTimeout(()=>{ stage.style.borderColor = "#222"; }, 1000);
}
</script>
</body>
</html>

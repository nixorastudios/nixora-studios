<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIXORA - Lipsync</title>
<style>
body {
  background: #0a0a0a;
  color: #fff;
  font-family: sans-serif;
  padding: 20px;
}
.box {
  max-width: 750px;
  margin: auto;
  background: #141414;
  padding: 25px;
  border-radius: 16px;
  border: 1px solid #222;
  text-align: center;
}
.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-top: 20px;
}
.card {
  background: #000;
  border: 1px solid #222;
  border-radius: 12px;
  padding: 15px;
}
video, img {
  width: 100%;
  border-radius: 10px;
  background: #111;
  height: 200px;
  object-fit: cover;
}
input, textarea {
  width: 100%;
  padding: 10px;
  background: #111;
  border: 1px solid #333;
  color: #fff;
  border-radius: 8px;
  margin-top: 8px;
}
.btn {
  background: #ff6600;
  color: #000;
  padding: 16px;
  width: 100%;
  border: none;
  border-radius: 12px;
  font-weight: 900;
  margin-top: 20px;
  cursor: pointer;
  font-size: 16px;
}
</style>
</head>
<body>

<div class="box">
  <h2>LIPSYNC STUDIO - Module 7</h2>
  <p style="color:#888; margin:10px 0;">
    Free today: Browser Demo | Future: Wav2Lip on $15 server
  </p>

  <div class="row">
    <div class="card">
      <p style="font-size:13px; color:#888;">UPLOAD FACE / VIDEO</p>
      <input type="file" id="face" accept="image/*,video/*">
      <img id="preview" src="" style="display:none; margin-top:10px;">
      <video id="previewVideo" style="display:none; margin-top:10px;" muted loop></video>
    </div>
    <div class="card">
      <p style="font-size:13px; color:#888;">AUDIO / TEXT</p>
      <textarea id="text" placeholder="Type what mouth should say...">Welcome to Nixora Studios. This is God Mode lipsync.</textarea>
      <input type="file" id="audio" accept="audio/*">
    </div>
  </div>

  <button class="btn" onclick="doLipsync()">
    GENERATE LIPSYNC → GOD MODE
  </button>

  <p id="status" style="color:#ff6600; margin-top:15px; font-size:13px;">
    Ready - Waiting for face + voice
  </p>

  <div id="result" style="margin-top:20px; display:none; background:#000; padding:15px; border-radius:12px; border:1px dashed #ff6600;">
    <p style="color:#ff6600; font-weight:800;">LIPSYNC PREVIEW ACTIVE</p>
    <p style="color:#888; font-size:13px; margin-top:8px;">Browser demo: Mouth moves with text. Real Wav2Lip will activate when you switch engine to self-host.</p>
  </div>
</div>

<script src="../config/engines.js"></script>
<script>
const faceInput = document.getElementById('face');
const preview = document.getElementById('preview');
const previewVideo = document.getElementById('previewVideo');

faceInput.addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  if (file.type.startsWith('video')) {
    preview.style.display = 'none';
    previewVideo.style.display = 'block';
    previewVideo.src = url;
    previewVideo.play();
  } else {
    previewVideo.style.display = 'none';
    preview.style.display = 'block';
    preview.src = url;
  }
});

function doLipsync() {
  const text = document.getElementById('text').value;
  if (!text) return alert('Type text boss');

  document.getElementById('result').style.display = 'block';
  document.getElementById('status').innerText = 'Speaking + Lipsyncing...';

  const utter = new SpeechSynthesisUtterance(text);
  window.speechSynthesis.speak(utter);

  // Fake mouth animation
  let open = false;
  const img = document.getElementById('preview');
  const interval = setInterval(() => {
    if (img.style.display === 'block') {
      img.style.transform = open? 'scaleY(1)' : 'scaleY(0.85)';
      open =!open;
    }
  }, 120);

  utter.onend = () => {
    clearInterval(interval);
    if (img) img.style.transform = 'scaleY(1)';
    const engine = (typeof NIXORA_ENGINES!== 'undefined')? NIXORA_ENGINES['lipsync'] : 'self-host';
    document.getElementById('status').innerText = 'Done | Engine: ' + engine + ' - Demo done. Real Wav2Lip will auto-switch when you buy server.';
  };
}
</script>

</body>
</html>

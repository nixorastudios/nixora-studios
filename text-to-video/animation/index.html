<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIXORA - Animation</title>
<style>
body {
  background: #0a0a0a;
  color: #fff;
  text-align: center;
  padding: 40px;
  font-family: sans-serif;
}
.box {
  max-width: 600px;
  margin: auto;
  background: #141414;
  padding: 30px;
  border-radius: 16px;
  border: 1px solid #222;
}
.btn {
  background: #ff6600;
  color: #000;
  padding: 15px 30px;
  border: none;
  border-radius: 12px;
  font-weight: 900;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="box">
  <h2>ANIMATION STUDIO - Module 4</h2>
  <p style="color:#888;">Browser-based - No server needed - Works forever free</p>
  
  <div id="stage" style="width:100%; height:300px; background:#000; margin:20px 0; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:50px;">
    🎬
  </div>
  
  <button class="btn" onclick="playAnim()">
    PLAY ANIMATION
  </button>
  
  <p style="margin-top:15px; color:#ff6600;">
    Engine: browser - Auto ready - No switch needed
  </p>
</div>

<script src="../config/engines.js"></script>
<script>
function playAnim() {
  document.getElementById('stage').innerHTML = '✨ ANIMATION PLAYING - NIXORA GOD MODE ✨';
}
</script>

</body>
</html>

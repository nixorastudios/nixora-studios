<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIXORA - Code Engine</title>
<style>
body {
  background: #0a0a0a;
  color: #fff;
  font-family: monospace;
  padding: 20px;
}
.box {
  max-width: 1000px;
  margin: auto;
  background: #141414;
  padding: 20px;
  border-radius: 16px;
  border: 1px solid #222;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
select, input {
  padding: 10px;
  background: #000;
  border: 1px solid #333;
  color: #fff;
  border-radius: 8px;
  font-family: monospace;
}
.editor-area {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-top: 15px;
}
.panel {
  background: #000;
  border-radius: 12px;
  border: 1px solid #222;
  padding: 12px;
  min-height: 400px;
  display: flex;
  flex-direction: column;
}
.panel-title {
  font-size: 12px;
  color: #888;
  margin-bottom: 8px;
  font-weight: 800;
}
textarea {
  flex: 1;
  background: #0a0a0a;
  border: 1px solid #222;
  color: #00ff88;
  padding: 12px;
  border-radius: 8px;
  font-family: monospace;
  font-size: 13px;
  resize: none;
  min-height: 350px;
}
#preview {
  background: #fff;
  border: none;
  width: 100%;
  height: 350px;
  border-radius: 8px;
}
.controls {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}
.btn {
  padding: 12px 20px;
  border-radius: 10px;
  border: none;
  font-weight: 800;
  cursor: pointer;
  font-size: 13px;
}
.btn-orange {
  background: #ff6600;
  color: #000;
}
.btn-dark {
  background: #222;
  color: #fff;
  border: 1px solid #333;
}
</style>
</head>
<body>

<div class="box">
  <div class="header">
    <h2 style="font-family:sans-serif;">CODE ENGINE - Module 10</h2>
    <select id="lang">
      <option value="html">HTML / Landing</option>
      <option value="javascript">JavaScript</option>
      <option value="python">Python</option>
      <option value="react">React</option>
    </select>
  </div>
  <p style="color:#888; font-size:12px; margin:10px 0; font-family:sans-serif;">
    Free today: Groq + Browser Runner | Future: Your self-host code model | 2-in-1: AI Generator + Live Preview
  </p>

  <input type="text" id="prompt" placeholder="Describe app: e.g. Build a NIXORA pricing page with 3 plans, dark mode, orange accent..." style="width:100%; margin-bottom:10px;">

  <div class="controls">
    <button class="btn btn-orange" onclick="generateCode()">GENERATE CODE → $0</button>
    <button class="btn btn-dark" onclick="runCode()">▶ RUN / PREVIEW</button>
    <button class="btn btn-dark" onclick="copyCode()">Copy</button>
    <button class="btn btn-dark" onclick="downloadCode()">Download</button>
  </div>

  <div class="editor-area">
    <div class="panel">
      <div class="panel-title">AI CODE OUTPUT</div>
      <textarea id="codeOutput" placeholder="// Your generated code will appear here...&#10;// God Mode ready">// NIXORA CODE ENGINE - God Mode
// Waiting for prompt...

function nixoraGodMode() {
  console.log("Boss owns the AI, not rents it");
  return "10 modules ready, auto-switch to self-host";
}

nixoraGodMode();
</textarea>
    </div>
    <div class="panel">
      <div class="panel-title">LIVE PREVIEW</div>
      <iframe id="preview"></iframe>
      <p id="status" style="color:#ff6600; font-size:11px; margin-top:8px; font-family:sans-serif;">Ready - Waiting for prompt</p>
    </div>
  </div>
</div>

<script src="../config/engines.js"></script>
<script>
const GROQ_KEY_PLACEHOLDER = ""; // Boss will add free Groq key later in config

async function generateCode() {
  const prompt = document.getElementById('prompt').value;
  const lang = document.getElementById('lang').value;
  if(!prompt) return alert('Type what to build boss');

  const codeArea = document.getElementById('codeOutput');
  const status = document.getElementById('status');

  status.innerText = 'Generating with free engine...';
  codeArea.value = '// Generating ' + lang + ' for: ' + prompt + '\n// Please wait...';

  // Engine switch logic
  const engine = (typeof NIXORA_ENGINES!=='undefined')? NIXORA_ENGINES['code-engine'] : 'groq';

  if(engine === 'groq' || engine === 'browser') {
    // Free browser template generator - works today $0
    let generated = '';
    if(lang === 'html') {
      generated = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nixora - ${prompt}</title>
<style>
body { background:#0a0a0a; color:#fff; font-family:sans-serif; padding:40px; text-align:center; }
.card { background:#141414; padding:30px; border-radius:16px; border:1px solid #222; max-width:600px; margin:auto; }
.btn { background:#ff6600; color:#000; padding:15px 30px; border:none; border-radius:12px; font-weight:900; }
</style>
</head>
<body>
  <div class="card">
    <h1>${prompt}</h1>
    <p>Built by NIXORA CODE ENGINE - God Mode</p>
    <p style="color:#888; margin:15px 0;">This page was generated free, no server. When you switch to self-host, it will use your own code model.</p>
    <button class="btn">LAUNCH APP</button>
  </div>
</body>
</html>`;
    } else if(lang === 'javascript') {
      generated = `// ${prompt}
function buildApp() {
  const app = document.createElement('div');
  app.innerHTML = '<h1>${prompt}</h1><p>Built by NIXORA God Mode</p>';
  app.style.cssText = 'background:#141414;color:#fff;padding:30px;border-radius:16px;text-align:center;';
  document.body.appendChild(app);
  console.log('Nixora God Mode Active');
}
buildApp();`;
    } else {
      generated = `# ${prompt} - Generated by NIXORA
def nixora_app():
    print("Boss: ${prompt}")
    print("God Mode: 10 modules ready")
    print("Engine: ${engine} - Auto switch to self-host later")
    return "Success - NIXORA owns the AI"

nixora_app()`;
    }

    codeArea.value = generated;
    status.innerText = 'Generated | Engine: ' + engine + ' | Free template. Add Groq API key for real AI generation, or switch to self-host later.';
    runCode();
    return;
  }

  // Self-host path (future)
  status.innerText = 'Calling self-host code model...';
  // fetch('https://your-runpod/api/code', {method:'POST', body: JSON.stringify({prompt, lang})})
}

function runCode() {
  const code = document.getElementById('codeOutput').value;
  const lang = document.getElementById('lang').value;
  const iframe = document.getElementById('preview');

  if(lang === 'html' || code.includes('<!DOCTYPE') || code.includes('<html')) {
    iframe.srcdoc = code;
  } else {
    iframe.srcdoc = `<pre style="background:#000;color:#00ff88;padding:20px;white-space:pre-wrap;">${code.replace(/</g,'&lt;')}</pre><script>${code}<\/script>`;
  }
  document.getElementById('status').innerText = 'Preview updated - God Mode Runner';
}

function copyCode() {
  const code = document.getElementById('codeOutput').value;
  navigator.clipboard.writeText(code);
  document.getElementById('status').innerText = 'Copied to clipboard - Ready to deploy';
}

function downloadCode() {
  const code = document.getElementById('codeOutput').value;
  const blob = new Blob([code], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'nixora-app-' + Date.now() + '.html';
  a.click();
  document.getElementById('status').innerText = 'Downloaded - God Mode file saved';
}
</script>

</body>
</html>

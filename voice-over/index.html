<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIXORA - Voice Over</title>
<style>
body {
  background: #0a0a0a;
  color: #fff;
  font-family: sans-serif;
  padding: 20px;
}
.box {
  max-width: 700px;
  margin: auto;
  background: #141414;
  padding: 25px;
  border-radius: 16px;
  border: 1px solid #222;
}
textarea {
  width: 100%;
  background: #000;
  border: 1px solid #333;
  color: #fff;
  padding: 12px;
  border-radius: 10px;
  min-height: 120px;
}
select {
  width: 100%;
  padding: 12px;
  background: #000;
  border: 1px solid #333;
  color: #fff;
  border-radius: 10px;
  margin-top: 12px;
}
.btn {
  background: #ff6600;
  color: #000;
  padding: 14px;
  width: 100%;
  border: none;
  border-radius: 12px;
  font-weight: 900;
  margin-top: 15px;
  cursor: pointer;
  font-size: 16px;
}
</style>
</head>
<body>

<div class="box">
  <h2>VOICE OVER - Module 5</h2>
  <p style="color:#888; margin:10px 0;">
    Free today: Browser Voice | Future: Coqui TTS on your $15 server
  </p>

  <textarea id="text">Welcome to Nixora Studios. You own the AI, you don't rent it. This is God Mode voice.</textarea>

  <select id="voiceSel">
    <option>Loading voices...</option>
  </select>

  <button class="btn" onclick="speak()">
    GENERATE VOICE → $0
  </button>

  <p id="status" style="color:#ff6600; margin-top:12px; font-size:13px;"></p>
</div>

<script src="../config/engines.js"></script>
<script>
const synth = window.speechSynthesis;

function loadVoices() {
  const voices = synth.getVoices();
  const sel = document.getElementById('voiceSel');
  sel.innerHTML = '';
  voices.forEach(v => {
    const opt = document.createElement('option');
    opt.textContent = v.name + ' (' + v.lang + ')';
    opt.value = v.name;
    sel.appendChild(opt);
  });
}

synth.onvoiceschanged = loadVoices;
setTimeout(loadVoices, 500);

function speak() {
  const text = document.getElementById('text').value;
  const sel = document.getElementById('voiceSel');
  const voices = synth.getVoices();
  const voice = voices.find(v => v.name === sel.value);
  
  const utter = new SpeechSynthesisUtterance(text);
  if (voice) utter.voice = voice;
  
  synth.speak(utter);
  
  const engine = (typeof NIXORA_ENGINES !== 'undefined') ? NIXORA_ENGINES['voice-over'] : 'browser';
  document.getElementById('status').innerText = 'Engine: ' + engine + ' - Playing free. When you switch to self-host, will use Coqui TTS auto.';
}
</script>

</body>
</html>

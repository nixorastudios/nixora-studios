<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIXORA - Sound Effects</title>
<style>
body {
  background: #0a0a0a;
  color: #fff;
  font-family: sans-serif;
  padding: 20px;
}
.box {
  max-width: 700px;
  margin: auto;
  background: #141414;
  padding: 25px;
  border-radius: 16px;
  border: 1px solid #222;
  text-align: center;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}
.btn {
  background: #1a1a1a;
  border: 1px solid #333;
  color: #fff;
  padding: 20px;
  border-radius: 12px;
  font-weight: 800;
  cursor: pointer;
  font-size: 14px;
}
.btn:hover {
  border-color: #ff6600;
  color: #ff6600;
}
.main-btn {
  background: #ff6600;
  color: #000;
  padding: 16px;
  width: 100%;
  border: none;
  border-radius: 12px;
  font-weight: 900;
  margin-top: 20px;
  cursor: pointer;
  font-size: 16px;
}
input {
  width: 100%;
  padding: 12px;
  background: #000;
  border: 1px solid #333;
  color: #fff;
  border-radius: 10px;
  margin-top: 15px;
}
</style>
</head>
<body>

<div class="box">
  <h2>SOUND EFFECTS - Module 6</h2>
  <p style="color:#888; margin:10px 0;">
    Free today: Browser Audio Engine | Future: AudioGen on $15 server
  </p>

  <input type="text" id="prompt" placeholder="Type effect: thunder, whoosh, explosion, laser..." value="cinematic whoosh">

  <div class="grid">
    <button class="btn" onclick="playSound('whoosh')">💨 Whoosh</button>
    <button class="btn" onclick="playSound('boom')">💥 Boom</button>
    <button class="btn" onclick="playSound('laser')">🔫 Laser</button>
    <button class="btn" onclick="playSound('thunder')">⚡ Thunder</button>
  </div>

  <button class="main-btn" onclick="playCustom()">
    GENERATE SOUND → $0
  </button>

  <p id="status" style="color:#ff6600; margin-top:15px; font-size:13px;">
    Ready - God Mode
  </p>
</div>

<script src="../config/engines.js"></script>
<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'whoosh') {
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.5);
  }
  if (type === 'boom') {
    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
  }
  if (type === 'laser') {
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
  }
  if (type === 'thunder') {
    osc.frequency.setValueAtTime(80, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 1);
  }

  gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.6);

  const engine = (typeof NIXORA_ENGINES !== 'undefined') ? NIXORA_ENGINES['sound-effects'] : 'browser';
  document.getElementById('status').innerText = 'Played: ' + type + ' | Engine: ' + engine + ' - Free browser. Will auto-switch to self-host AudioGen.';
}

function playCustom() {
  const text = document.getElementById('prompt').value.toLowerCase();
  if (text.includes('boom') || text.includes('explosion')) playSound('boom');
  else if (text.includes('laser') || text.includes('gun')) playSound('laser');
  else if (text.includes('thunder') || text.includes('storm')) playSound('thunder');
  else playSound('whoosh');
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIXORA - Video Editor</title>
<style>
body {
  background: #0a0a0a;
  color: #fff;
  font-family: sans-serif;
  padding: 20px;
}
.box {
  max-width: 900px;
  margin: auto;
  background: #141414;
  padding: 25px;
  border-radius: 16px;
  border: 1px solid #222;
}
.preview-area {
  background: #000;
  border-radius: 12px;
  border: 1px solid #222;
  height: 360px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  margin-top: 15px;
}
video {
  max-width: 100%;
  max-height: 100%;
}
.text-overlay {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 28px;
  font-weight: 900;
  text-shadow: 2px 2px 8px #000;
  color: #ff6600;
  pointer-events: none;
}
.timeline {
  margin-top: 15px;
  background: #000;
  border-radius: 10px;
  padding: 12px;
  border: 1px solid #222;
}
input[type="range"] {
  width: 100%;
}
.controls {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}
.btn {
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-weight: 800;
  cursor: pointer;
  font-size: 13px;
}
.btn-orange {
  background: #ff6600;
  color: #000;
}
.btn-dark {
  background: #222;
  color: #fff;
  border: 1px solid #333;
}
input, textarea {
  width: 100%;
  padding: 12px;
  background: #000;
  border: 1px solid #333;
  color: #fff;
  border-radius: 10px;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="box">
  <h2>VIDEO EDITOR - Module 9</h2>
  <p style="color:#888; font-size:13px; margin:10px 0;">
    Free today: Browser Editor (no upload) | Future: FFmpeg on $15 server
  </p>

  <input type="file" id="videoFile" accept="video/*">
  <input type="text" id="overlayText" placeholder="Add text overlay: e.g. NIXORA STUDIOS GOD MODE" oninput="updateText()">

  <div class="preview-area" id="previewArea">
    <span style="color:#444;">Upload video to preview</span>
    <video id="video" style="display:none;" controls></video>
    <div id="textOverlay" class="text-overlay"></div>
  </div>

  <div class="timeline">
    <p style="font-size:12px; color:#888;">TRIM TIMELINE</p>
    <label style="font-size:12px;">Start: <span id="startLabel">0.0</span>s</label>
    <input type="range" id="startRange" min="0" max="100" value="0" oninput="trimUpdate()">
    <label style="font-size:12px; margin-top:10px; display:block;">End: <span id="endLabel">100%</span></label>
    <input type="range" id="endRange" min="0" max="100" value="100" oninput="trimUpdate()">
  </div>

  <div class="controls">
    <button class="btn btn-dark" onclick="playPause()">▶ Play / Pause</button>
    <button class="btn btn-dark" onclick="addSpeed()">⚡ Speed x2</button>
    <button class="btn btn-dark" onclick="addFilter()">🎨 Filter</button>
    <button class="btn btn-orange" onclick="exportVideo()">EXPORT → $0</button>
  </div>

  <p id="status" style="color:#ff6600; margin-top:12px; font-size:13px;">Ready - God Mode Editor</p>
</div>

<script src="../config/engines.js"></script>
<script>
let video = document.getElementById('video');
let fileInput = document.getElementById('videoFile');
let currentFilter = 0;
const filters = ['none','grayscale(100%)','sepia(100%)','contrast(200%)','hue-rotate(90deg)'];

fileInput.addEventListener('change', function() {
  const file = this.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  video.src = url;
  video.style.display = 'block';
  document.getElementById('previewArea').querySelector('span').style.display='none';
  video.onloadedmetadata = () => {
    document.getElementById('endRange').max = Math.floor(video.duration);
    document.getElementById('startRange').max = Math.floor(video.duration);
    document.getElementById('endLabel').innerText = video.duration.toFixed(1)+'s';
    document.getElementById('status').innerText = 'Loaded: ' + file.name + ' | Duration: ' + video.duration.toFixed(1) + 's | Browser editor ready';
  };
});

function updateText() {
  const txt = document.getElementById('overlayText').value;
  document.getElementById('textOverlay').innerText = txt;
}

function playPause() {
  if(video.paused) video.play(); else video.pause();
}

function trimUpdate() {
  const start = document.getElementById('startRange').value;
  const end = document.getElementById('endRange').value;
  document.getElementById('startLabel').innerText = start;
  document.getElementById('endLabel').innerText = end;
  video.currentTime = parseFloat(start);
  document.getElementById('status').innerText = 'Trim set: ' + start + 's to ' + end + 's';
}

function addSpeed() {
  video.playbackRate = video.playbackRate === 1? 2 : 1;
  document.getElementById('status').innerText = 'Speed: ' + video.playbackRate + 'x';
}

function addFilter() {
  currentFilter = (currentFilter + 1) % filters.length;
  video.style.filter = filters[currentFilter];
  document.getElementById('status').innerText = 'Filter: ' + filters[currentFilter];
}

function exportVideo() {
  const engine = (typeof NIXORA_ENGINES!=='undefined')? NIXORA_ENGINES['video-editor'] : 'browser';
  if(engine === 'browser') {
    alert('Boss - Free browser export: Use screen recorder or video download (right-click video > Save). When self-host enabled, real FFmpeg export with trim + text overlay + filters will auto-work.');
    document.getElementById('status').innerText = 'Engine: browser - Preview export ready. Self-host FFmpeg will activate auto when you buy server.';
  } else {
    document.getElementById('status').innerText = 'Exporting via self-host FFmpeg...';
    // Future: fetch('https://your-runpod/api/export', {method:'POST', body: FormData...})
  }
}
</script>

</body>
</html>

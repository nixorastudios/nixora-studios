<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIXORA - Photo to Video</title>
<style>body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:20px;text-align:center}.box{max-width:700px;margin:auto;background:#141414;padding:30px;border-radius:16px;border:1px solid #222}.btn{background:#ff6600;color:#000;padding:15px;width:100%;border-radius:12px;font-weight:900;border:none;margin-top:15px;cursor:pointer} input{width:100%;padding:12px;background:#000;border:1px solid #333;color:#fff;border-radius:10px}</style></head><body>
<div class="box"><h2>PHOTO TO VIDEO - Module 2</h2><p style="color:#888;margin:10px 0">Free today: Browser Ken Burns | Future: RunPod AnimateDiff</p><input type="file" id="photo" accept="image/*"><canvas id="canvas" style="width:100%;margin-top:20px;border-radius:12px;background:#000"></canvas><button class="btn" onclick="makeVideo()">ANIMATE PHOTO → $0</button><p id="status" style="margin-top:10px;color:#ff6600"></p></div>
<script src="../config/engines.js"></script><script>
function makeVideo(){ const file=document.getElementById('photo').files[0]; if(!file)return alert('Upload photo boss'); const img=new Image(); img.src=URL.createObjectURL(file); img.onload=()=>{ const c=document.getElementById('canvas'); const ctx=c.getContext('2d'); c.width=img.width; c.height=img.height; let scale=1; function animate(){ ctx.clearRect(0,0,c.width,c.height); ctx.save(); ctx.scale(scale,scale); ctx.drawImage(img,0,0); ctx.restore(); scale+=0.001; if(scale<1.2) requestAnimationFrame(animate); } animate(); document.getElementById('status').innerText='Engine: '+(NIXORA_ENGINES['photo-to-video']||'browser')+' - Animated (Free, will switch to self-host auto when you buy)'; }; }
</script></body></html>
